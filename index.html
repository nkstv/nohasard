<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoHasard.com — Tous mes sites</title>
  <meta name="description" content="Retrouve tous mes projets et sites au même endroit sur NoHasard.com.">
  <meta name="theme-color" content="#ffffff">

  <!-- Open Graph -->
  <meta property="og:title" content="NoHasard.com — Tous mes sites">
  <meta property="og:description" content="Tous mes projets regroupés au même endroit.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://nohasard.com/">

  <!-- Favicon inline -->
  <link rel="icon" href="data:image/svg+xml,
  %3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E
    %3Crect width='64' height='64' rx='14' fill='%230f1115'/%3E
    %3Cpath d='M17 47V17h8l14 18V17h8v30h-8L25 29v18z' fill='white'/%3E
  %3C/svg%3E">

  <style>
    :root {
      --bg: #f8f8f6;
      --card: #ffffff;
      --text: #111318;
      --muted: #70747c;
      --border: #e8e8e5;
      --shadow: 0 10px 35px rgba(17, 19, 24, 0.055);
      --radius: 22px;
      --max-width: 680px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(255,255,255,.95), transparent 42%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: min(calc(100% - 32px), var(--max-width));
      margin: 0 auto;
      padding: 72px 0 42px;
    }

    .header {
      text-align: center;
      margin-bottom: 48px;
    }

    .logo {
      width: 76px;
      height: 76px;
      display: grid;
      place-items: center;
      margin: 0 auto 22px;
      border-radius: 22px;
      background: #111318;
      color: white;
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -4px;
      box-shadow: 0 14px 30px rgba(17,19,24,.13);
      user-select: none;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 52px);
      line-height: 1;
      letter-spacing: -2.2px;
      font-weight: 800;
    }

    .intro {
      margin: 14px auto 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.55;
    }

    .links {
      display: grid;
      gap: 14px;
    }

    .link-card {
      position: relative;
      display: flex;
      align-items: center;
      gap: 18px;
      width: 100%;
      min-height: 106px;
      padding: 22px 24px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: rgba(255,255,255,.92);
      box-shadow: var(--shadow);
      transition:
        transform .18s ease,
        border-color .18s ease,
        box-shadow .18s ease;
    }

    .link-card:hover {
      transform: translateY(-3px);
      border-color: #d8d8d4;
      box-shadow: 0 16px 42px rgba(17,19,24,.08);
    }

    .site-logo {
      flex: 0 0 52px;
      width: 52px;
      height: 52px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid #ededeb;
      background: #f5f5f3;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .site-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .content {
      min-width: 0;
      flex: 1;
    }

    .site-name {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 0 0 6px;
      font-size: 20px;
      line-height: 1.15;
      font-weight: 750;
      letter-spacing: -.6px;
    }

    .arrow {
      display: inline-block;
      color: #8a8e95;
      font-size: 17px;
      transform: translateY(-1px);
      transition: transform .18s ease, color .18s ease;
    }

    .link-card:hover .arrow {
      transform: translate(2px, -3px);
      color: var(--text);
    }

    .description {
      margin: 0;
      color: var(--muted);
      font-size: 14.5px;
      line-height: 1.45;
    }

    footer {
      text-align: center;
      margin-top: 42px;
      color: #a0a2a7;
      font-size: 12px;
      letter-spacing: .08em;
    }

    @media (max-width: 560px) {
      .page {
        width: min(calc(100% - 24px), var(--max-width));
        padding-top: 42px;
      }

      .header {
        margin-bottom: 32px;
      }

      .logo {
        width: 66px;
        height: 66px;
        border-radius: 19px;
        font-size: 31px;
        margin-bottom: 18px;
      }

      h1 {
        letter-spacing: -1.6px;
      }

      .intro {
        font-size: 15px;
      }

      .link-card {
        min-height: 94px;
        padding: 18px;
        border-radius: 19px;
      }

      .site-logo {
        flex-basis: 46px;
        width: 46px;
        height: 46px;
        border-radius: 13px;
        font-size: 17px;
      }

      .site-name {
        font-size: 18px;
      }

      .description {
        font-size: 13.5px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="header">
      <div class="logo">N</div>
      <h1>NoHasard.com</h1>
      <p class="intro">Tous mes projets au même endroit.</p>
    </header>

    <section class="links" id="links"></section>

    <footer>
      NOHASARD.COM
    </footer>
  </main>

  <script>
    /*
    ======================================================
      GÈRE TOUS TES LIENS ICI
    ======================================================

    - name        = nom affiché
    - url         = lien du site
    - description = petite description sous le nom
    - logo        = URL du logo / favicon (optionnel)
    - initials    = texte affiché si tu ne mets pas de logo

    Pour ajouter un site :
    copie simplement un bloc { ... } et modifie les infos.
    */

    const sites = [
      {
        name: "EcomStrike.com",
        url: "https://ecomstrike.com/",
        description: "Business en ligne, SEO et méthodes concrètes.",
        logo: "",
        initials: "ES"
      },
      {
        name: "Adsifast.com",
        url: "https://adsifast.com/",
        description: "Alertes Vinted rapides directement sur Telegram.",
        logo: "",
        initials: "A"
      },
      {
        name: "Kidomine.com",
        url: "https://kidomine.com/",
        description: "Le jeu de duels pour savoir qui est le plus connu.",
        logo: "",
        initials: "K"
      },
      {
        name: "BusinessFusion.fr",
        url: "https://businessfusion.fr/",
        description: "Conseils et ressources pour développer un business en ligne.",
        logo: "",
        initials: "BF"
      },
      {
        name: "CardMonster.fr",
        url: "https://cardmonster.fr/",
        description: "Cartes Pokémon, produits scellés et collection.",
        logo: "",
        initials: "CM"
      }
    ];

    const container = document.getElementById("links");

    sites.forEach(site => {
      const link = document.createElement("a");
      link.className = "link-card";
      link.href = site.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";

      const logo = site.logo
        ? `<div class="site-logo"><img src="${site.logo}" alt=""></div>`
        : `<div class="site-logo">${site.initials || site.name.charAt(0)}</div>`;

      link.innerHTML = `
        ${logo}
        <div class="content">
          <div class="site-name">
            ${site.name}
            <span class="arrow">↗</span>
          </div>
          <p class="description">${site.description}</p>
        </div>
      `;

      container.appendChild(link);
    });
  </script>
</body>
</html>
